services:

  # Banco de dados
  db:
    image: postgres:16-alpine
    container_name: pirataflix-db
    environment:
      POSTGRES_DB: dbPirataFlix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pirataflix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbPirataFlix"]
      interval: 5s
      timeout: 5s
      retries: 10
  # API Python Flask
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.node
    container_name: pirataflix-backend
    environment:
      DB_NAME: dbPirataFlix
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pirataflix-network

  # Frontend React com Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.node
    container_name: pirataflix-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pirataflix-network

volumes:
  postgres_data:

networks:
  pirataflix-network:
    driver: bridge